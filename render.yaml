services:
  - type: web
    name: roviq-core
    runtime: node
    plan: free
    branch: main
    buildCommand: npm ci --include=dev --no-audit --no-fund && npm run build
    startCommand: npm run db:migrate:prod && npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_API_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ISSUER
        value: roviq-core
      - key: JWT_AUDIENCE
        value: roviq-apps
      - key: ALLOW_DEV_HEADERS
        value: "false"
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
