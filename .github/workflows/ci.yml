name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  worker-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run tests
        run: npm test
      - name: Compile the authoritative Core API
        run: npm run build
      - name: Validate Cloudflare Worker bundle
        run: npx wrangler deploy --dry-run

  portal-builds:
    name: portal-build (${{ matrix.portal }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        portal: [customer, ops, partner, diagnostic, tow, parts]
        include:
          - portal: customer
            directory: web
          - portal: ops
            directory: ops
          - portal: partner
            directory: partner
          - portal: diagnostic
            directory: diagnostic
          - portal: tow
            directory: tow
          - portal: parts
            directory: parts-portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install ${{ matrix.portal }} dependencies
        working-directory: ${{ matrix.directory }}
        run: npm ci --no-audit --no-fund
      - name: Build ${{ matrix.portal }} portal
        working-directory: ${{ matrix.directory }}
        env:
          VITE_API_BASE_URL: https://roviq-core.admytruk79.workers.dev
        run: npm run build

  system-acceptance:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: roviq_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d roviq_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/roviq_test
      ADMIN_API_KEY: ci-admin-key
      JWT_SECRET: ci-system-acceptance-jwt-secret-32-characters-minimum
      JWT_ISSUER: roviq-core
      JWT_AUDIENCE: roviq-apps
      ALLOW_DEV_HEADERS: 'true'
      BOOTSTRAP_ADMIN_EMAIL: acceptance-admin@roviq.test
      BOOTSTRAP_ADMIN_PASSWORD: AcceptanceAdminPassword123!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Apply migrations to fresh acceptance database
        run: npm run db:migrate
      - name: Run full Core end-to-end acceptance suite
        run: npm run test:e2e
