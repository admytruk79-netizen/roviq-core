name: CI

on:
  push:
    branches: [main, productionize-shop-os-operations]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  worker-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/roviq_unit_test
      ADMIN_API_KEY: ci-admin-key
      JWT_SECRET: ci-worker-check-jwt-secret-32-characters-minimum
      JWT_ISSUER: roviq-core
      JWT_AUDIENCE: roviq-apps
      ALLOW_DEV_HEADERS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run tests
        run: npm test
      - name: Compile the authoritative Core API
        run: npm run build
      - name: Validate Cloudflare Worker bundle
        run: npx wrangler deploy --dry-run

  portal-builds:
    name: portal-build (${{ matrix.portal }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        portal: [customer, ops, partner, diagnostic, tow, parts]
        include:
          - portal: customer
            directory: web
          - portal: ops
            directory: ops
          - portal: partner
            directory: partner
          - portal: diagnostic
            directory: diagnostic
          - portal: tow
            directory: tow
          - portal: parts
            directory: parts-portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json
      - name: Install ${{ matrix.portal }} dependencies
        working-directory: ${{ matrix.directory }}
        run: npm ci --no-audit --no-fund
      - name: Build ${{ matrix.portal }} portal
        working-directory: ${{ matrix.directory }}
        env:
          VITE_API_BASE_URL: https://roviq-core.admytruk79.workers.dev
        run: npm run build
      - name: Record accessibility baseline and enforce performance budget
        run: node scripts/check-portal-evidence.mjs ${{ matrix.directory }}

  system-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: roviq_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d roviq_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/roviq_test
      ADMIN_API_KEY: ci-admin-key
      JWT_SECRET: ci-system-acceptance-jwt-secret-32-characters-minimum
      JWT_ISSUER: roviq-core
      JWT_AUDIENCE: roviq-apps
      ALLOW_DEV_HEADERS: 'true'
      BOOTSTRAP_ADMIN_EMAIL: acceptance-admin@roviq.test
      BOOTSTRAP_ADMIN_PASSWORD: AcceptanceAdminPassword123!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Apply migrations to fresh acceptance database
        run: npm run db:migrate
      - name: Run full Core end-to-end acceptance suite
        run: npm run test:e2e
      - name: Prove database backup and restore
        shell: bash
        run: |
          set -euo pipefail
          pg_dump "$DATABASE_URL" --format=custom --no-owner --no-acl --file=/tmp/roviq-acceptance.dump
          dropdb --if-exists --host=localhost --username=postgres roviq_restore_test
          createdb --host=localhost --username=postgres roviq_restore_test
          pg_restore --host=localhost --username=postgres --dbname=roviq_restore_test --no-owner --no-acl /tmp/roviq-acceptance.dump
          psql "postgresql://postgres:postgres@localhost:5432/roviq_restore_test" -v ON_ERROR_STOP=1 <<'SQL'
          select case when count(*) > 0 then 1 else 1/0 end as migrations_restored from schema_migrations;
          select case when to_regclass('public.service_cases') is not null then 1 else 1/0 end as service_cases_restored;
          select case when to_regclass('public.payment_intents') is not null then 1 else 1/0 end as payments_restored;
          select case when to_regclass('public.audit_log') is not null then 1 else 1/0 end as audit_restored;
          SQL
          test -s /tmp/roviq-acceptance.dump
          echo "Backup/restore evidence: $(du -h /tmp/roviq-acceptance.dump | cut -f1) dump restored successfully."
      - name: Prove active pilot survives database restart
        shell: bash
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          insert into organizations(id,organization_type,display_name,status)
          values('00000000-0000-4000-8000-000000000901','repair_partner','CI Restart Pilot','active')
          on conflict(id) do nothing;
          insert into locations(id,organization_id,name,country_code,region,city)
          values('00000000-0000-4000-8000-000000000902','00000000-0000-4000-8000-000000000901','CI Restart Shop','US','OR','Portland')
          on conflict(id) do nothing;
          insert into pilot_runs(id,organization_id,location_id,status,readiness_snapshot,evidence,started_at)
          values(
            '00000000-0000-4000-8000-000000000903',
            '00000000-0000-4000-8000-000000000901',
            '00000000-0000-4000-8000-000000000902',
            'active',
            '{"ready":true,"source":"ci_restart_evidence"}'::jsonb,
            '{}'::jsonb,
            now()
          )
          on conflict(id) do update set status='active',updated_at=now();
          SQL
          PG_CONTAINER="$(docker ps --filter ancestor=postgres:16 --format '{{.ID}}' | head -n1)"
          test -n "$PG_CONTAINER"
          docker restart "$PG_CONTAINER" >/dev/null
          for attempt in $(seq 1 30); do
            if pg_isready --host=localhost --port=5432 --username=postgres --dbname=roviq_test >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          pg_isready --host=localhost --port=5432 --username=postgres --dbname=roviq_test
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          select case when status='active' then 1 else 1/0 end as active_pilot_survived_restart
          from pilot_runs
          where id='00000000-0000-4000-8000-000000000903';
          select case when readiness_snapshot->>'source'='ci_restart_evidence' then 1 else 1/0 end as pilot_evidence_survived_restart
          from pilot_runs
          where id='00000000-0000-4000-8000-000000000903';
          SQL
          npm run db:migrate
