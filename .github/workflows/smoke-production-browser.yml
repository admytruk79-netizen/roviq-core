name: Smoke ROVIQ Production Browser

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tests/production-browser-lifecycle.mjs'
      - 'tests/production-auth-probe.mjs'
      - 'src/**'
      - 'web/**'
      - 'diagnostic/**'
      - 'partner/**'
      - 'parts-portal/**'
      - 'tow/**'
      - 'ops/**'
      - '.github/workflows/smoke-production-browser.yml'

permissions:
  contents: read

concurrency:
  group: roviq-production-browser
  cancel-in-progress: false

jobs:
  browser-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      EDGE_URL: https://roviq-core.admytruk79.workers.dev
      RENDER_URL: https://roviq-core.onrender.com
      EXPECTED_SHA: ${{ github.sha }}
      ADMIN_EMAIL: ${{ secrets.BOOTSTRAP_ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.BOOTSTRAP_ADMIN_PASSWORD }}
      BROWSER_ARTIFACT_DIR: artifacts/production-browser
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned Playwright runtime
        run: npm install --no-save --ignore-scripts playwright@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser render smoke - desktop and mobile
        env:
          BROWSER_MODE: render
        run: node tests/production-browser-lifecycle.mjs

      - name: Wait for exact Render Core revision
        if: ${{ env.ADMIN_EMAIL != '' && env.ADMIN_PASSWORD != '' }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 72); do
            status="$(curl --silent --show-error --location \
              --max-time 25 --output /tmp/render-health.json --write-out '%{http_code}' \
              "$RENDER_URL/health" || true)"
            revision="$(jq -r '.revision // empty' /tmp/render-health.json 2>/dev/null || true)"
            if [[ "$status" == "200" && "$revision" == "$EXPECTED_SHA" ]]; then
              echo "Render Core is running expected revision $EXPECTED_SHA"
              break
            fi
            if [[ "$attempt" == "72" ]]; then
              echo "Render Core did not reach expected revision $EXPECTED_SHA"
              echo "Last HTTP status: $status"
              echo "Last reported revision: ${revision:-none}"
              cat /tmp/render-health.json || true
              exit 1
            fi
            echo "Waiting for Render deploy: status=$status revision=${revision:-none} attempt=$attempt/72"
            sleep 10
          done

      - name: Report Render migration state
        if: ${{ env.ADMIN_EMAIL != '' && env.ADMIN_PASSWORD != '' }}
        shell: bash
        run: |
          curl --silent --show-error --max-time 25 "$RENDER_URL/ready" || true
          echo

      - name: Diagnose credentialed Customer auth path
        if: ${{ env.ADMIN_EMAIL != '' && env.ADMIN_PASSWORD != '' }}
        run: node tests/production-auth-probe.mjs

      - name: Diagnose actors payload backing the Ops Tow handoff select
        if: ${{ env.ADMIN_EMAIL != '' && env.ADMIN_PASSWORD != '' }}
        shell: bash
        run: |
          set -euo pipefail
          login="$(curl --silent --show-error --max-time 25 -X POST "$EDGE_URL/api/auth/login" \
            -H 'content-type: application/json' \
            -d "{\"email\":\"$ADMIN_EMAIL\",\"password\":\"$ADMIN_PASSWORD\"}")"
          token="$(echo "$login" | jq -r '.accessToken')"
          for i in 1 2 3; do
            start=$(date +%s%3N)
            actors="$(curl --silent --show-error --max-time 25 --write-out '\n%{http_code}' "$EDGE_URL/api/admin/actors?status=active" -H "authorization: Bearer $token")"
            end=$(date +%s%3N)
            code="$(echo "$actors" | tail -n1)"
            body="$(echo "$actors" | sed '$d')"
            echo "attempt=$i status=$code took=$((end-start))ms total=$(echo "$body" | jq '.actors | length' 2>/dev/null || echo 'parse_error')"
            echo "$body" | jq '[.actors[].actor_type] | group_by(.) | map({type: .[0], count: length})' 2>/dev/null || true
          done

      - name: Credentialed full production lifecycle
        if: ${{ env.ADMIN_EMAIL != '' && env.ADMIN_PASSWORD != '' }}
        env:
          BROWSER_MODE: lifecycle
        run: node tests/production-browser-lifecycle.mjs

      - name: Note credentialed lifecycle availability
        if: ${{ env.ADMIN_EMAIL == '' || env.ADMIN_PASSWORD == '' }}
        run: |
          echo 'Credentialed browser lifecycle skipped because BOOTSTRAP_ADMIN_EMAIL / BOOTSTRAP_ADMIN_PASSWORD are not injected into GitHub Actions.'
          echo 'This does not change or invalidate the working production credentials.'
          echo 'The desktop/mobile browser render smoke still ran against all six deployed portals.'

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roviq-production-browser-evidence-${{ github.run_number }}
          path: artifacts/production-browser
          if-no-files-found: warn
          retention-days: 14
