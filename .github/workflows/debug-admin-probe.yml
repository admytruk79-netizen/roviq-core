name: Debug ROVIQ Admin Probe

on:
  workflow_dispatch:
    inputs:
      offer_id:
        description: 'Offer id to replay respond(accepted) against'
        required: true

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EDGE_URL: https://roviq-core.admytruk79.workers.dev
      ADMIN_EMAIL: ${{ secrets.BOOTSTRAP_ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.BOOTSTRAP_ADMIN_PASSWORD }}
      DEBUG_OFFER_ID: ${{ github.event.inputs.offer_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run admin transition replay
        run: node tests/production-admin-debug.mjs
