name: Rotate ROVIQ Core Database Secret

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  set-secret:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Push DATABASE_URL to Cloudflare Worker secrets
        run: |
          test -n "$NEON_DATABASE_URL" || (echo "NEON_DATABASE_URL repo secret is missing" && exit 1)
          printf '%s' "$NEON_DATABASE_URL" | npx wrangler secret put DATABASE_URL --config wrangler.jsonc

      - name: Push DATABASE_URL to Render service env vars
        run: |
          test -n "$NEON_DATABASE_URL" || (echo "NEON_DATABASE_URL repo secret is missing" && exit 1)
          test -n "$RENDER_API_KEY" || (echo "RENDER_API_KEY repo secret is missing" && exit 1)
          test -n "$RENDER_SERVICE_ID" || (echo "RENDER_SERVICE_ID repo secret is missing" && exit 1)

          existing_response=$(curl -sS -w '\n%{http_code}' -H "Authorization: Bearer $RENDER_API_KEY" \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/env-vars")
          existing_status=$(echo "$existing_response" | tail -n1)
          existing_body=$(echo "$existing_response" | sed '$d')
          if [ "$existing_status" != "200" ]; then
            echo "Failed to fetch existing Render env vars (HTTP $existing_status):" >&2
            echo "$existing_body" >&2
            exit 1
          fi

          merged=$(echo "$existing_body" | jq -c '[.[].envVar | select(.key != "DATABASE_URL")] + [{"key":"DATABASE_URL","value":env.NEON_DATABASE_URL}]')

          put_response=$(curl -sS -w '\n%{http_code}' -X PUT \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/env-vars" \
            -d "$merged")
          put_status=$(echo "$put_response" | tail -n1)
          put_body=$(echo "$put_response" | sed '$d')
          if [ "$put_status" != "200" ] && [ "$put_status" != "201" ]; then
            echo "Failed to update Render env vars (HTTP $put_status):" >&2
            echo "$put_body" >&2
            exit 1
          fi
          echo "Render env vars updated successfully."
