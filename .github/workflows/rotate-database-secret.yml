name: Rotate ROVIQ Core Database Secret

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  set-secret:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Push DATABASE_URL to Cloudflare Worker secrets
        run: |
          test -n "${{ secrets.NEON_DATABASE_URL }}" || (echo "NEON_DATABASE_URL repo secret is missing" && exit 1)
          printf '%s' "${{ secrets.NEON_DATABASE_URL }}" | npx wrangler secret put DATABASE_URL --config wrangler.jsonc
