name: Scheduled Operations Sweep

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-native-cron:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify native Cloudflare scheduled operations
        run: |
          response=$(curl -sS --max-time 20 https://roviq-core.admytruk79.workers.dev/health)
          echo "$response"
          echo "$response" | grep -q '"scheduledOperations":"cloudflare-cron"' || (
            echo "Native Cloudflare operations cron is not advertised by production Core" >&2
            exit 1
          )
          echo "Scheduled operations run natively in the ROVIQ Core Worker every 10 minutes."
