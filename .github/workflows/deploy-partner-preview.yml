name: Deploy ROVIQ Partner Preview

on:
  push:
    branches: [productionize-shop-os-operations]
    paths:
      - 'partner/**'
      - '.github/workflows/deploy-partner-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: roviq-partner-preview
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VITE_API_BASE_URL: https://roviq-core.admytruk79.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: productionize-shop-os-operations

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: partner/package-lock.json

      - name: Install dependencies
        working-directory: partner
        run: npm ci --no-audit --no-fund

      - name: Build partner portal
        working-directory: partner
        run: npm run build

      - name: Verify Cloudflare credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "CLOUDFLARE_API_TOKEN is missing" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "CLOUDFLARE_ACCOUNT_ID is missing" && exit 1)

      - name: Ensure Cloudflare Pages project exists
        working-directory: partner
        shell: bash
        run: |
          npx wrangler pages project list | grep -qw roviq-partner \
            || npx wrangler pages project create roviq-partner --production-branch=main

      - name: Deploy branch preview to Cloudflare Pages
        working-directory: partner
        run: npx wrangler pages deploy dist --project-name=roviq-partner --branch=productionize-shop-os-operations --commit-dirty=true
