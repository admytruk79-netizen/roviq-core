name: Deploy ROVIQ Hyperdrive Rebuild

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: roviq-core-hyperdrive-rebuild
  cancel-in-progress: true

jobs:
  verify-rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_URL: https://roviq-core-rebuild.admytruk79.workers.dev
    steps:
      - name: Checkout rebuild branch
        uses: actions/checkout@v4
        with:
          ref: rebuild/neon-core

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate migrations and bundle
        shell: bash
        run: |
          npm run db:validate-migrations
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          grep -q '"name": "roviq-core-rebuild"' wrangler.jsonc
          grep -q '"main": "cloudflare/idempotency-worker.js"' wrangler.jsonc
          grep -q '"binding": "HYPERDRIVE"' wrangler.jsonc
          grep -q '"binding": "AI"' wrangler.jsonc
          npx wrangler deploy --dry-run --config wrangler.jsonc

      - name: Deploy isolated rebuild worker
        run: npx wrangler deploy --config wrangler.jsonc

      - name: Ensure JWT signing secret
        shell: bash
        run: |
          SECRET_LIST=$(npx wrangler secret list --name roviq-core-rebuild)
          if ! echo "$SECRET_LIST" | grep -q 'ROVIQ_JWT_SECRET'; then
            JWT_SECRET=$(openssl rand -hex 48)
            printf '%s' "$JWT_SECRET" | npx wrangler secret put ROVIQ_JWT_SECRET --name roviq-core-rebuild
          fi

      - name: Rotate masked E2E token and wait for propagation
        shell: bash
        run: |
          E2E_TOKEN=$(openssl rand -hex 32)
          echo "::add-mask::$E2E_TOKEN"
          echo "ROVIQ_E2E_TOKEN=$E2E_TOKEN" >> "$GITHUB_ENV"
          printf '%s' "$E2E_TOKEN" | npx wrangler secret put ROVIQ_E2E_TOKEN --name roviq-core-rebuild
          STATUS=000
          BODY_FILE=$(mktemp)
          for i in $(seq 1 20); do
            STATUS=$(curl --silent --show-error --max-time 10 -o "$BODY_FILE" -w '%{http_code}' \
              "$WORKER_URL/api/internal/e2e/auth-check" -H "Authorization: Bearer $E2E_TOKEN" || true)
            echo "secret propagation attempt=$i status=$STATUS"
            [ "$STATUS" = "200" ] && break
            sleep 2
          done
          rm -f "$BODY_FILE"
          test "$STATUS" = "200"

      - name: Verify infrastructure and migration parity
        shell: bash
        run: |
          EXPECTED=$(find migrations -maxdepth 1 -type f -name '[0-9][0-9][0-9]*.sql' | wc -l | tr -d ' ')
          HEALTH=$(curl --fail-with-body --silent --show-error --max-time 30 "$WORKER_URL/health")
          READY=$(curl --fail-with-body --silent --show-error --max-time 30 "$WORKER_URL/ready")
          AI=$(curl --fail-with-body --silent --show-error --max-time 45 "$WORKER_URL/api/ai/ping")
          PROD=$(curl --fail-with-body --silent --show-error --max-time 30 "$WORKER_URL/api/core/production-capabilities")
          OPS=$(curl --fail-with-body --silent --show-error --max-time 30 "$WORKER_URL/api/core/operations-capabilities")
          echo "$HEALTH" | grep -q '"databaseTransport":"hyperdrive-neon"'
          echo "$READY" | grep -q '"database":"reachable"'
          echo "$READY" | grep -q "\"migration_count\":$EXPECTED"
          echo "$AI" | grep -q '"ok":true'
          echo "$PROD" | grep -q '"layer":"production-core-v1"'
          echo "$OPS" | grep -q '"layer":"operations-core-v1"'

      - name: Verify complete rebuild behavior
        shell: bash
        run: |
          SERVICE=$(curl --fail-with-body --silent --show-error --max-time 150 \
            -X POST "$WORKER_URL/api/internal/e2e/service-case" \
            -H "Authorization: Bearer $ROVIQ_E2E_TOKEN" -H 'Content-Type: application/json' --data '{}')
          echo "$SERVICE" | grep -q '"ok":true'
          echo "$SERVICE" | grep -q 'CASE_COMPLETED'
          for ENDPOINT in production-core auth-projection operations idempotency; do
            BODY=$(curl --fail-with-body --silent --show-error --max-time 180 \
              -X POST "$WORKER_URL/api/internal/e2e/$ENDPOINT" \
              -H "Authorization: Bearer $ROVIQ_E2E_TOKEN" -H 'Content-Type: application/json' --data '{}')
            echo "$BODY" | grep -q '"ok":true'
          done
