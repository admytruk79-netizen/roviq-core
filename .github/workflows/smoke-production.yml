name: Smoke ROVIQ Production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/smoke-production.yml'

permissions:
  contents: read

concurrency:
  group: roviq-production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify Core health
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --retry 6 --retry-delay 5 --retry-all-errors \
            https://roviq-core.admytruk79.workers.dev/health \
            | tee /tmp/core-health.json
          grep -Eq '"(ok|status|service)"' /tmp/core-health.json

      - name: Verify production front ends
        shell: bash
        run: |
          set -euo pipefail
          urls=(
            "https://roviq-web-dxv.pages.dev"
            "https://roviq-diagnostic-net.pages.dev"
            "https://roviq-partner.pages.dev"
            "https://roviq-parts-net.pages.dev"
            "https://roviq-tow-net.pages.dev"
            "https://roviq-ops.pages.dev"
          )
          for url in "${urls[@]}"; do
            echo "Checking $url"
            body="$(curl --fail --silent --show-error --location \
              --retry 6 --retry-delay 5 --retry-all-errors \
              --max-time 20 "$url")"
            test -n "$body"
            printf '%s' "$body" | grep -Eqi '<!doctype html|<html'
          done
