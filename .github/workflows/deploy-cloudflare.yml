name: Deploy ROVIQ Core to Cloudflare

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cloudflare/**'
      - 'package.json'
      - 'wrangler.jsonc'
      - '.github/workflows/deploy-cloudflare.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify deployment credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "CLOUDFLARE_API_TOKEN is missing in roviq-core GitHub Actions secrets" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "CLOUDFLARE_ACCOUNT_ID is missing in roviq-core GitHub Actions secrets" && exit 1)

      - name: Validate Cloudflare Worker bundle
        run: npx wrangler deploy --dry-run

      - name: Deploy ROVIQ Core Worker
        run: npx wrangler deploy
