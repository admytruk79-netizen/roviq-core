name: Deploy ROVIQ Core to Cloudflare

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cloudflare/**'
      - 'package.json'
      - 'wrangler.jsonc'
      - '.github/workflows/deploy-cloudflare.yml'

permissions:
  contents: read

concurrency:
  group: roviq-core-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify Cloudflare credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "CLOUDFLARE_API_TOKEN is missing" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "CLOUDFLARE_ACCOUNT_ID is missing" && exit 1)
          npx wrangler whoami

      - name: Validate Worker bundle
        run: npx wrangler deploy --dry-run --config wrangler.jsonc

      - name: Deploy ROVIQ Core
        run: npx wrangler deploy --config wrangler.jsonc

      - name: Verify production health
        shell: bash
        run: |
          for i in 1 2 3 4 5; do
            if curl --fail --silent --show-error --max-time 15 https://roviq-core.admytruk79.workers.dev/health; then
              echo
              exit 0
            fi
            sleep 5
          done
          echo "ROVIQ Core health check failed after deploy"
          exit 1
