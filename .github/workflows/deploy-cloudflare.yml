name: Deploy ROVIQ Core Worker

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: roviq-core-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Show deployment source
        shell: bash
        run: |
          echo "commit=$(git rev-parse HEAD)"
          grep -q "@neondatabase/serverless" cloudflare/worker.js
          if grep -q "Fastify\|@cloudflare/containers" cloudflare/worker.js; then
            echo "Refusing to deploy stale Fastify/container Worker entrypoint"
            exit 1
          fi
          cat wrangler.jsonc

      - name: Verify Cloudflare credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "CLOUDFLARE_API_TOKEN is missing" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "CLOUDFLARE_ACCOUNT_ID is missing" && exit 1)
          npx wrangler whoami

      - name: Validate native Worker bundle
        run: npx wrangler deploy --dry-run --config wrangler.jsonc

      - name: Deploy native ROVIQ Core Worker
        run: npx wrangler deploy --config wrangler.jsonc

      - name: Verify Core and Neon
        shell: bash
        run: |
          for i in $(seq 1 12); do
            HEALTH=$(curl --silent --show-error --max-time 15 https://roviq-core.admytruk79.workers.dev/health || true)
            READY=$(curl --silent --show-error --max-time 15 https://roviq-core.admytruk79.workers.dev/ready || true)
            echo "health=$HEALTH"
            echo "ready=$READY"
            if echo "$HEALTH" | grep -q '"ok":true' && echo "$READY" | grep -q '"database":"reachable"'; then
              exit 0
            fi
            sleep 5
          done
          echo "ROVIQ Core did not become healthy and Neon-ready"
          exit 1
