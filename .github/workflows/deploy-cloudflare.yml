name: Deploy Full ROVIQ Core MVP to Cloudflare

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'migrations/**'
      - 'cloudflare/**'
      - 'Dockerfile'
      - 'package.json'
      - 'wrangler.jsonc'
      - '.github/workflows/deploy-cloudflare.yml'

permissions:
  contents: read

concurrency:
  group: roviq-core-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Docker
        run: docker info >/dev/null

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build full Core
        run: npm run build

      - name: Verify Cloudflare credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "CLOUDFLARE_API_TOKEN is missing" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "CLOUDFLARE_ACCOUNT_ID is missing" && exit 1)
          npx wrangler whoami

      - name: Validate Cloudflare configuration
        run: npx wrangler deploy --dry-run --config wrangler.jsonc

      - name: Deploy full ROVIQ Core MVP
        run: npx wrangler deploy --config wrangler.jsonc

      - name: Verify full Core health and Neon readiness
        shell: bash
        run: |
          for i in $(seq 1 30); do
            HEALTH=$(curl --silent --show-error --max-time 20 https://roviq-core.admytruk79.workers.dev/health || true)
            READY=$(curl --silent --show-error --max-time 20 https://roviq-core.admytruk79.workers.dev/ready || true)
            echo "health=$HEALTH"
            echo "ready=$READY"
            if echo "$HEALTH" | grep -q '"ok"' && echo "$READY" | grep -q '"ok"'; then
              exit 0
            fi
            sleep 10
          done
          echo "ROVIQ Core container did not become healthy and Neon-ready"
          exit 1
