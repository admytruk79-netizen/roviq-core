name: Deploy ROVIQ Shop OS App

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'partner/**'
      - 'shared/theme/**'
      - '.github/workflows/deploy-shop.yml'
permissions:
  contents: read

concurrency:
  group: roviq-shop-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VITE_API_BASE_URL: https://roviq-core.admytruk79.workers.dev
      # The standalone shop management app: the partner workspace with Shop OS branding and
      # self-registration. The same code stays embedded in Actor for network partners.
      VITE_PRODUCT: shop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: partner
        run: npm ci --no-audit --no-fund

      - name: Build
        working-directory: partner
        run: npm run build

      - name: Verify Cloudflare credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "CLOUDFLARE_API_TOKEN is missing" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "CLOUDFLARE_ACCOUNT_ID is missing" && exit 1)

      - name: Ensure Cloudflare Pages project exists
        working-directory: partner
        shell: bash
        run: |
          npx wrangler pages project list | grep -qw roviq-shop \
            || npx wrangler pages project create roviq-shop --production-branch=main

      - name: Deploy to Cloudflare Pages
        working-directory: partner
        run: npx wrangler pages deploy dist --project-name=roviq-shop --branch=main --commit-dirty=true
