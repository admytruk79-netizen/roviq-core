name: Provision ROVIQ Role Portal Account

on:
  workflow_dispatch:
    inputs:
      admin_email:
        description: 'Existing production admin email'
        required: true
      admin_password:
        description: 'Existing production admin password'
        required: true
      portal_role:
        description: 'Portal account to create'
        required: true
        type: choice
        options:
          - partner
          - diagnostic
          - parts
          - tow
      account_email:
        description: 'Email for the new role account'
        required: true
      account_password:
        description: 'Password for the new role account (12+ characters)'
        required: true
      display_name:
        description: 'Optional operation/provider name stored on the actor'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      API_BASE: https://roviq-core.admytruk79.workers.dev
    steps:
      - name: Mask credentials
        shell: bash
        run: |
          echo "::add-mask::${{ inputs.admin_password }}"
          echo "::add-mask::${{ inputs.account_password }}"

      - name: Validate inputs
        shell: bash
        run: |
          set -euo pipefail
          test "${#ACCOUNT_PASSWORD}" -ge 12
          case "$PORTAL_ROLE" in
            partner|diagnostic|parts|tow) ;;
            *) echo "Unsupported portal role"; exit 1 ;;
          esac
        env:
          ACCOUNT_PASSWORD: ${{ inputs.account_password }}
          PORTAL_ROLE: ${{ inputs.portal_role }}

      - name: Authenticate production admin
        id: admin_login
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error \
            --request POST "$API_BASE/api/auth/login" \
            --header 'content-type: application/json' \
            --data "$(jq -nc --arg email "$ADMIN_EMAIL" --arg password "$ADMIN_PASSWORD" '{email:$email,password:$password}')")"
          token="$(jq -r '.accessToken // empty' <<< "$response")"
          role="$(jq -r '.principal.role // empty' <<< "$response")"
          test "$role" = "admin"
          test -n "$token"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
        env:
          ADMIN_EMAIL: ${{ inputs.admin_email }}
          ADMIN_PASSWORD: ${{ inputs.admin_password }}

      - name: Create actor
        id: actor
        shell: bash
        run: |
          set -euo pipefail
          attributes="$(jq -nc --arg name "$DISPLAY_NAME" '{provisionedFor:"role_portal",displayName:$name}')"
          payload="$(jq -nc --arg actorType "$PORTAL_ROLE" --argjson attributes "$attributes" '{actorType:$actorType,attributes:$attributes}')"
          response="$(curl --fail-with-body --silent --show-error \
            --request POST "$API_BASE/api/admin/actors" \
            --header "authorization: Bearer $ADMIN_TOKEN" \
            --header 'content-type: application/json' \
            --data "$payload")"
          actor_id="$(jq -r '.actor.id // empty' <<< "$response")"
          test -n "$actor_id"
          echo "actor_id=$actor_id" >> "$GITHUB_OUTPUT"
          echo "Created $PORTAL_ROLE actor $actor_id"
        env:
          ADMIN_TOKEN: ${{ steps.admin_login.outputs.token }}
          PORTAL_ROLE: ${{ inputs.portal_role }}
          DISPLAY_NAME: ${{ inputs.display_name }}

      - name: Create login identity
        shell: bash
        run: |
          set -euo pipefail
          payload="$(jq -nc \
            --arg email "$ACCOUNT_EMAIL" \
            --arg password "$ACCOUNT_PASSWORD" \
            --arg role "$PORTAL_ROLE" \
            --arg actorId "$ACTOR_ID" \
            '{email:$email,password:$password,role:$role,actorId:$actorId}')"
          response="$(curl --fail-with-body --silent --show-error \
            --request POST "$API_BASE/api/admin/identities" \
            --header "authorization: Bearer $ADMIN_TOKEN" \
            --header 'content-type: application/json' \
            --data "$payload")"
          identity_id="$(jq -r '.identity.id // empty' <<< "$response")"
          test -n "$identity_id"
          echo "Role portal account created for $ACCOUNT_EMAIL ($PORTAL_ROLE)."
        env:
          ADMIN_TOKEN: ${{ steps.admin_login.outputs.token }}
          ACCOUNT_EMAIL: ${{ inputs.account_email }}
          ACCOUNT_PASSWORD: ${{ inputs.account_password }}
          PORTAL_ROLE: ${{ inputs.portal_role }}
          ACTOR_ID: ${{ steps.actor.outputs.actor_id }}

      - name: Verify role login
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error \
            --request POST "$API_BASE/api/auth/login" \
            --header 'content-type: application/json' \
            --data "$(jq -nc --arg email "$ACCOUNT_EMAIL" --arg password "$ACCOUNT_PASSWORD" '{email:$email,password:$password}')")"
          test "$(jq -r '.principal.role // empty' <<< "$response")" = "$PORTAL_ROLE"
          test "$(jq -r '.principal.actorId // empty' <<< "$response")" = "$ACTOR_ID"
          echo "Verified actor-scoped $PORTAL_ROLE login."
        env:
          ACCOUNT_EMAIL: ${{ inputs.account_email }}
          ACCOUNT_PASSWORD: ${{ inputs.account_password }}
          PORTAL_ROLE: ${{ inputs.portal_role }}
          ACTOR_ID: ${{ steps.actor.outputs.actor_id }}
