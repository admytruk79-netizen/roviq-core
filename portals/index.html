<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#08111C" />
  <title>ROVIQ</title>
  <meta name="description" content="Unified ROVIQ portal for Customer, Diagnostic, Partner, Parts, Tow/Valet and Operations." />
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#F4F2ED;background:#08111C;--black:#050A0F;--navy:#101D2C;--panel:#0D1B2A;--panel2:#13253A;--copper:#E46F35;--teal:#58DFCF;--porcelain:#F4F2ED;--slate:#647386;--muted:#9AA5B3;--line:rgba(244,242,237,.13)}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--black)}body{min-height:100vh;background:radial-gradient(circle at 82% 0%,rgba(88,223,207,.07),transparent 32rem),radial-gradient(circle at 12% 0%,rgba(228,111,53,.09),transparent 30rem),linear-gradient(180deg,#101D2C 0%,#08111C 58%,#050A0F 100%);color:var(--porcelain)}
    button,a{font:inherit}.shell{min-height:100vh;display:flex;flex-direction:column}.topbar{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:17px 20px;border-bottom:1px solid var(--line);background:rgba(5,10,15,.82);backdrop-filter:blur(18px);position:sticky;top:0;z-index:10}.brand{display:flex;align-items:center;gap:12px;font-size:18px;font-weight:900;letter-spacing:.16em}.brand-word{color:var(--porcelain)}.context{color:var(--teal);font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
    .launcher{padding:18px 18px 14px;border-bottom:1px solid var(--line)}.launcher-head{max-width:1200px;margin:0 auto 12px;display:flex;align-items:end;justify-content:space-between;gap:16px}.launcher-title{margin:0;font-size:14px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}.launcher-note{margin:0;color:var(--slate);font-size:12px}.tiles{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}.tile{appearance:none;text-align:left;min-height:92px;padding:14px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(180deg,rgba(19,37,58,.92),rgba(13,27,42,.92));color:var(--porcelain);cursor:pointer;transition:transform .16s ease,border-color .16s ease,background .16s ease,box-shadow .16s ease;box-shadow:0 10px 30px rgba(0,0,0,.16)}.tile:hover{transform:translateY(-1px);border-color:rgba(88,223,207,.38)}.tile.active{border-color:var(--teal);background:linear-gradient(180deg,rgba(19,43,57,.98),rgba(10,29,40,.98));box-shadow:0 0 0 1px rgba(88,223,207,.10),0 12px 34px rgba(0,0,0,.22)}.tile-kicker{display:block;font-size:10px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--teal);margin-bottom:9px}.tile-name{display:block;font-size:15px;font-weight:850;letter-spacing:.01em}.tile-sub{display:block;margin-top:5px;font-size:11px;line-height:1.35;color:var(--muted)}.tile.active .tile-name{color:#fff}.tile-arrow{float:right;color:var(--copper);font-weight:900}
    .stage-wrap{padding:0 18px 18px;flex:1;display:flex;min-height:0}.stage{position:relative;max-width:1200px;width:100%;margin:0 auto;min-height:680px;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--navy);box-shadow:0 20px 60px rgba(0,0,0,.28)}.stage-bar{height:45px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 13px;border-bottom:1px solid var(--line);background:#0A1623}.stage-name{font-size:12px;font-weight:800;color:var(--porcelain)}.stage-open{text-decoration:none;color:var(--copper);font-size:11px;font-weight:850;letter-spacing:.04em}.frame{width:100%;height:calc(100% - 45px);min-height:635px;border:0;display:block;background:var(--navy)}.loading{position:absolute;inset:45px 0 0;display:grid;place-items:center;background:var(--navy);color:var(--muted);font-size:13px;letter-spacing:.05em;z-index:2}.loading.hidden{display:none}
    @media(max-width:980px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
    @media(max-width:640px){.topbar{padding:13px 14px}.brand{font-size:16px}.context{font-size:10px}.launcher{padding:14px 12px 12px}.launcher-head{align-items:flex-start;flex-direction:column;gap:4px}.launcher-note{display:none}.tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.tile{min-height:86px;padding:12px;border-radius:14px}.tile-name{font-size:14px}.tile-sub{font-size:10px}.stage-wrap{padding:0 12px 12px}.stage{min-height:720px;border-radius:15px}.frame{min-height:675px}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand"><span class="brand-word">ROVIQ</span></div>
      <div class="context" id="context">Customer portal</div>
    </header>

    <section class="launcher" aria-label="ROVIQ portal launcher">
      <div class="launcher-head">
        <p class="launcher-title">ROVIQ Network</p>
        <p class="launcher-note">Choose a workspace. It opens below without leaving ROVIQ.</p>
      </div>
      <div class="tiles">
        <button class="tile active" data-name="Customer" data-url="https://roviq-core-customer.pages.dev"><span class="tile-kicker">Driver</span><span class="tile-name">Customer <span class="tile-arrow">→</span></span><span class="tile-sub">Service requests and case progress</span></button>
        <button class="tile" data-name="Diagnostic" data-url="https://roviq-diagnostic-net.pages.dev"><span class="tile-kicker">Field</span><span class="tile-name">Diagnostic <span class="tile-arrow">→</span></span><span class="tile-sub">Assessment and vehicle triage</span></button>
        <button class="tile" data-name="Partner" data-url="https://roviq-partner.pages.dev"><span class="tile-kicker">Network</span><span class="tile-name">Partner <span class="tile-arrow">→</span></span><span class="tile-sub">Repair shops and dealerships</span></button>
        <button class="tile" data-name="Parts" data-url="https://roviq-parts-net.pages.dev"><span class="tile-kicker">Supply</span><span class="tile-name">Parts <span class="tile-arrow">→</span></span><span class="tile-sub">Inventory and fulfillment</span></button>
        <button class="tile" data-name="Tow / Valet" data-url="https://roviq-tow-net.pages.dev"><span class="tile-kicker">Mobility</span><span class="tile-name">Tow / Valet <span class="tile-arrow">→</span></span><span class="tile-sub">Dispatch and vehicle movement</span></button>
        <button class="tile" data-name="Ops" data-url="https://roviq-ops.pages.dev"><span class="tile-kicker">Control</span><span class="tile-name">Ops <span class="tile-arrow">→</span></span><span class="tile-sub">Cases, network and exceptions</span></button>
      </div>
    </section>

    <section class="stage-wrap">
      <div class="stage">
        <div class="stage-bar"><span class="stage-name" id="stageName">Customer</span><a id="fallback" class="stage-open" href="https://roviq-core-customer.pages.dev" target="_blank" rel="noopener">Open full screen ↗</a></div>
        <div class="loading" id="loading">Loading ROVIQ…</div>
        <iframe id="portalFrame" class="frame" src="https://roviq-core-customer.pages.dev" title="ROVIQ Customer portal" allow="geolocation; clipboard-read; clipboard-write"></iframe>
      </div>
    </section>
  </main>
  <script>
    const frame=document.getElementById('portalFrame'),loading=document.getElementById('loading'),context=document.getElementById('context'),stageName=document.getElementById('stageName'),fallback=document.getElementById('fallback'),tiles=[...document.querySelectorAll('.tile')];
    function slug(name){return name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}
    function selectPortal(tile){const url=tile.dataset.url,name=tile.dataset.name;tiles.forEach(t=>t.classList.toggle('active',t===tile));context.textContent=name+' portal';stageName.textContent=name;fallback.href=url;loading.classList.remove('hidden');frame.title='ROVIQ '+name+' portal';frame.src=url;history.replaceState(null,'','#'+slug(name));if(window.innerWidth<641){document.querySelector('.stage-wrap').scrollIntoView({behavior:'smooth',block:'start'})}}
    tiles.forEach(tile=>tile.addEventListener('click',()=>selectPortal(tile)));frame.addEventListener('load',()=>loading.classList.add('hidden'));const requested=location.hash.slice(1);if(requested){const match=tiles.find(tile=>slug(tile.dataset.name)===requested);if(match)selectPortal(match)}
  </script>
</body>
</html>
